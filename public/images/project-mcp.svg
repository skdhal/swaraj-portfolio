<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">

  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" opacity="0.045"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1a1420" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0b080c" stop-opacity="1"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3340"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2a4ff"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="#0b080c"/>
  <rect width="1200" height="750" fill="url(#dots)"/>
  <rect width="1200" height="750" fill="url(#vignette)"/>

  <text x="60" y="66" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#8a76b3">AI / MCP</text>
  <text x="60" y="98" font-family="Georgia, serif" font-size="26" fill="#e9e4ee">Headless Document Intelligence</text>
  <line x1="60" y1="118" x2="1140" y2="118" stroke="#2a2430" stroke-width="1"/>

<rect x="60" y="320" width="260" height="110" rx="10" fill="#151016" stroke="#3a3340" stroke-width="1.2"/><text x="190.0" y="373.0" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="14" font-weight="600" fill="#e9e4ee">AI Agent</text><text x="190.0" y="391.0" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="11.5" fill="#8d8494">Natural language query</text><rect x="470" y="320" width="280" height="110" rx="10" fill="#1f1828" stroke="#c2a4ff" stroke-width="1.4"/><text x="610.0" y="373.0" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="14" font-weight="600" fill="#e9e4ee">MCP Server</text><text x="610.0" y="391.0" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="11.5" fill="#8d8494">Model Context Protocol</text><line x1="320" y1="375" x2="470" y2="375" stroke="#8a76b3" stroke-width="1.4" marker-end="url(#arrowAccent)"/><path d="M 470 400 C 400 400, 400 440, 320 430" fill="none" stroke="#3a3340" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#arrow)"/><rect x="900" y="190" width="240" height="100" rx="10" fill="#151016" stroke="#3a3340" stroke-width="1.2"/><text x="1020.0" y="238.0" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="14" font-weight="600" fill="#e9e4ee">Salesforce Files</text><text x="1020.0" y="256.0" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="11.5" fill="#8d8494">Documents</text><rect x="900" y="400" width="240" height="100" rx="10" fill="#151016" stroke="#3a3340" stroke-width="1.2"/><text x="1020.0" y="439.5" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="14" font-weight="600" fill="#e9e4ee">Contracts &amp;</text><text x="1020.0" y="456.5" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="14" font-weight="600" fill="#e9e4ee">Records</text><text x="1020.0" y="474.0" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="11.5" fill="#8d8494">REST</text><line x1="750" y1="350" x2="900" y2="250" stroke="#3a3340" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="750" y1="400" x2="900" y2="440" stroke="#3a3340" stroke-width="1.4" marker-end="url(#arrow)"/><text x="600.0" y="600" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="12.5" fill="#8d8494">Headless layer — no UI surface. The agent queries Salesforce content directly over MCP.</text>
<text x="60" y="712" font-family="'Geist', Arial, sans-serif" font-size="11.5" fill="#8d8494">Illustrative protocol flow — generic document types.</text>
</svg>