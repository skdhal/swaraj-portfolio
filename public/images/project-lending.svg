0" y1="265.0" x2="246.0" y2="265.0" stroke="#3a3340" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="396.0" y1="265.0" x2="432.0" y2="265.0" stroke="#8a76b3" stroke-width="1.4" marker-end="url(#arrowAccent)"/><line x1="582.0" y1="265.0" x2="618.0" y2="265.0" stroke="#3a3340" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="768.0" y1="265.0" x2="804.0" y2="265.0" stroke="#8a76b3" stroke-width="1.4" marker-end="url(#arrowAccent)"/><line x1="954.0" y1="265.0" x2="990.0" y2="265.0" stroke="#3a3340" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="60" y="370" width="1080" height="90" rx="10" fill="#1c1620" stroke="#2a2430" stroke-width="1"/><text x="86" y="404" font-family="Geist, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#c2a4ff">Defense-in-depth record locking</text><text x="86" y="426" font-family="Geist, Arial, sans-serif" font-size="12.5" fill="#8d8494">Row-level locks span every stage above — concurrent underwriters cannot commit conflicting edits to the same application.</text><text x="86" y="446" font-family="Geist, Arial, sans-serif" font-size="12.5" fill="#8d8494">Platform Events fan out status changes to compliance and quoting without polling.</text><rect x="60" y="500" width="153.2" height="24" rx="12" fill="none" stroke="#c2a4ff" stroke-width="1" opacity="0.7"/>
