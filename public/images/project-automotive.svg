<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">

  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" opacity="0.045"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1a1420" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0b080c" stop-opacity="1"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3340"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2a4ff"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="#0b080c"/>
  <rect width="1200" height="750" fill="url(#dots)"/>
  <rect width="1200" height="750" fill="url(#vignette)"/>

  <text x="60" y="66" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#8a76b3">AUTOMOTIVE CLOUD</text>
  <text x="60" y="98" font-family="Georgia, serif" font-size="26" fill="#e9e4ee">Multi-Dealer Data Segregation</text>
  <line x1="60" y1="118" x2="1140" y2="118" stroke="#2a2430" stroke-width="1"/>

<rect x="60" y="150" width="1080" height="460" rx="14" fill="#120e16" stroke="#3a3340" stroke-width="1.3" stroke-dasharray="4 5"/><text x="80" y="180" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2" fill="#8d8494">SINGLE SALESFORCE ORG</text><rect x="470.0" y="205" width="260" height="150" rx="10" fill="#1f1828" stroke="#c2a4ff" stroke-width="1.4"/><text x="600.0" y="277.0" text-anchor="middle" font-family="'Geist', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e9e4ee">Vehicle Inventory</text><text x="600.0" y="296.0" text-anchor="middle" font-family="'Geist', Arial, sans-serif" font-size="11.5" fill="#8d8494">Org-Wide Default: Private</text><rect x="175.0" y="495" width="190" height="90" rx="10" fill="#151016" stroke="#3a3340" stroke-width="1.2"/><text x="270.0" y="537.0" text-anchor="middle" font-family="'Geist', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e9e4ee">Dealer A</text><text x="270.0" y="556.0" text-anchor="middle" font-family="'Geist', Arial, sans-serif" font-size="11.5" fill="#8d8494">Row-level isolation</text><path d="M 270.0 495 C 270.0 435, 600.0 415, 600.0 355" fill="none" stroke="#8a76b3" stroke-width="1.4" marker-end="url(#arrowAccent)"/><rect x="395.0" y="495" width="190" height="90" rx="10" fill="#151016" stroke="#3a3340" stroke-width="1.2"/><text x="490.0" y="537.0" text-anchor="middle" font-family="'Geist', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e9e4ee">Dealer B</text><text x="490.0" y="556.0" text-anchor="middle" font-family="'Geist', Arial, sans-serif" font-size="11.5" fill="#8d8494">Row-level isolation</text><path d="M 490.0 495 C 490.0 435, 600.0 415, 600.0 355" fill="none" stroke="#8a76b3" stroke-width="1.4" marker-end="url(#arrowAccent)"/><rect x="615.0" y="495" width="190" height="90" rx="10" fill="#151016" stroke="#3a3340" stroke-width="1.2"/><text x="710.0" y="537.0" text-anchor="middle" font-family="'Geist', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e9e4ee">Dealer C</text><text x="710.0" y="556.0" text-anchor="middle" font-family="'Geist', Arial, sans-serif" font-size="11.5" fill="#8d8494">Row-level isolation</text><path d="M 710.0 495 C 710.0 435, 600.0 415, 600.0 355" fill="none" stroke="#8a76b3" stroke-width="1.4" marker-end="url(#arrowAccent)"/><rect x="835.0" y="495" width="190" height="90" rx="10" fill="#151016" stroke="#3a3340" stroke-width="1.2"/><text x="930.0" y="537.0" text-anchor="middle" font-family="'Geist', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e9e4ee">Dealer D</text><text x="930.0" y="556.0" text-anchor="middle" font-family="'Geist', Arial, sans-serif" font-size="11.5" fill="#8d8494">Row-level isolation</text><path d="M 930.0 495 C 930.0 435, 600.0 415, 600.0 355" fill="none" stroke="#8a76b3" stroke-width="1.4" marker-end="url(#arrowAccent)"/><text x="600.0" y="445" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="12.5" fill="#8d8494">Criteria-based sharing + Apex sharing recalculation — each partner sees only their own inventory rows</text>
<text x="60" y="712" font-family="'Geist', Arial, sans-serif" font-size="11.5" fill="#8d8494">Illustrative sharing model — dealer names are placeholders.</text>
</svg>